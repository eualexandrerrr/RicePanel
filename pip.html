<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>RicePanel · player</title>
  <style>
    /* Janela do player do vídeo (13/09/2026). No Mirante ela se encaixa na
       placa e some a barra; fora dele flutua, com a barra de título que o
       Windows usa para arrastar e as bordas para mudar o tamanho. */
    @font-face {
      font-family: 'Archivo Narrow';
      src: url('fontes/archivo-narrow-latin.woff2') format('woff2');
    }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: 'Archivo Narrow', 'Segoe UI', sans-serif; color: #cdd6f4; }
    #barra {
      -webkit-app-region: drag;
      position: absolute; left: 0; right: 0; top: 0; height: 30px;
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
      background: #1e1e2e; border-bottom: 1px solid #313244;
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
      cursor: move; user-select: none;
    }
    #titulo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #onde { margin-left: auto; flex: none; color: #a6adc8; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10.5px; }
    #quadro { position: absolute; left: 0; right: 0; top: 30px; bottom: 0; background: #000; }
    #quadro webview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* Na placa do Mirante não há barra: o título já está no pé da placa. */
    body.placa #barra { display: none; }
    body.placa #quadro { top: 0; }
  </style>
</head>
<body class="placa">
  <div id="barra"><span id="titulo">Vídeo</span><span id="onde">YouTube</span></div>
  <div id="quadro"></div>
  <script src="pip.js"></script>
</body>
</html>
