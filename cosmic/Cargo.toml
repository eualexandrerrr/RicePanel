[package]
name = "ricepanel"
version = "2.0.0"
edition = "2024"
rust-version = "1.93"
description = "Painel do monitor vertical, nativo do COSMIC"
license = "MIT"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic/", rev = "a401af8", features = [
    "wgpu",
    "single-instance",
    "tokio",
    "wayland",
    "multi-window",
    "dbus-config",
] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time", "process", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
tracing-journald = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset", "json"] }
rrule = "0.14.0"
chrono-tz = "0.10.4"
serde_json = "1.0.151"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
